apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gds-techlanders/eks-gitops-lab.git
    targetRevision: main
    path: apps/nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
